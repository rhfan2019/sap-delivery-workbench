name: sap-fsd-observability
services:
  jaeger-storage-init:
    image: jaegertracing/all-in-one:1.76.0
    user: '0'
    entrypoint: ['chown']
    command: ['10001:10001', '/badger']
    volumes:
      - trace_data:/badger
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: 'false'
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      BADGER_SPAN_STORE_TTL: 336h
    volumes:
      - trace_data:/badger
    depends_on:
      jaeger-storage-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:16686:16686'
  collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./fsd-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '127.0.0.1:4318:4318'
    depends_on:
      - jaeger
volumes:
  trace_data:
